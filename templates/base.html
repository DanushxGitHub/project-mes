<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AUTISO{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=5) }}">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="{{ url_for('home') }}" class="brand"><span class="brand-mark">A</span>UTISO</a>
      <nav class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('assess') }}">Assessment</a>
        <a href="{{ url_for('about') }}">About</a>
      </nav>
      <a href="{{ url_for('assess') }}" class="btn btn-primary btn-sm nav-cta">Start Screening</a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-brand">AUTISO — AI-Assisted Autism Behaviour &amp; Screening Analysis</p>
      <p class="footer-note">
        This tool provides preliminary screening support only and is not a medical diagnosis.
        Always consult a qualified healthcare professional.
      </p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js', v=5) }}"></script>
</body>
</html>
